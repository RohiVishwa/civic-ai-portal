<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Dispatch Login | CivicAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b1120 0%, #0f172a 50%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff !important;
            border-radius: 10px;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body>

<div class="login-card p-4 p-md-5">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 65px; height: 65px;">
            <i class="bi bi-shield-fill fs-2"></i>
        </div>
        <h4 class="fw-bold text-white mb-1">Officer Dispatch Login</h4>
        <p class="text-secondary small mb-0">Municipal Authority & Grievance Cell</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small mb-3 text-center">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">OFFICER USERNAME / ID</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                <input type="text" name="officer_id" class="form-control" placeholder="officer" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">PASSWORD</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="admin123" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow">
            <i class="bi bi-box-arrow-in-right me-1"></i> Access Officer Dashboard
        </button>

        <div class="text-center mt-3">
            <a href="/" class="text-secondary text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Return to Citizen Portal
            </a>
        </div>
    </form>
</div>

</body>
</html>
