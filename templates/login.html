<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAI - Officer Desk Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b1120 0%, #0f172a 50%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

<div class="login-card p-4 p-sm-5">
    <div class="text-center mb-4">
        <div class="mb-2">
            <span class="badge bg-info text-dark fw-bold px-3 py-1 rounded-pill">
                <i class="bi bi-shield-lock-fill"></i> MUNICIPAL CONTROL
            </span>
        </div>
        <h3 class="fw-bold text-white mb-1">Officer Desk Login</h3>
        <span class="text-secondary small">Authorized Municipal Corporation Access</span>
    </div>

    {% if error %}
    <div class="alert alert-danger border-danger bg-black text-danger py-2 px-3 small rounded-3 mb-3">
        <i class="bi bi-exclamation-octagon-fill me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">OFFICER USERNAME</label>
            <div class="input-group">
                <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="admin" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">PASSWORD</label>
            <div class="input-group">
                <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-key-fill"></i></span>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="admin123" required>
            </div>
            <div class="form-text text-secondary" style="font-size: 11px;">Default Hackathon Demo: <code>admin</code> / <code>admin123</code></div>
        </div>

        <button type="submit" class="btn btn-info w-100 py-2 fw-bold shadow mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Control Desk
        </button>

        <div class="text-center">
            <a href="/" class="text-secondary text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Return to Citizen Portal
            </a>
        </div>
    </form>
</div>

</body>
</html>
