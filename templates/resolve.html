<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Work Proof - {{ ticket.ticket_id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light p-4">
    <div class="container" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Work Proof: {{ ticket.ticket_id }}</h4>
            <button type="button" onclick="history.back()" class="btn btn-outline-secondary btn-sm">Back</button>
        </div>
        <p class="text-secondary">{{ ticket.description }}</p>
        <form action="/resolve_ticket/{{ ticket.ticket_id }}" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Attach Fixed/Solved Photo or Video Proof</label>
                <input type="file" name="proof_media" class="form-control" accept="image/*,video/*" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Confirm & Mark Resolved</button>
        </form>
    </div>
</body>
</html>
