<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAI - Citizen Incident Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b1120 0%, #0f172a 50%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        .portal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
        }
        .camera-box {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #475569;
        }
        #camera_feed, #camera_preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .live-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            z-index: 2;
        }
    </style>
</head>
<body class="py-4">
<div class="container" style="max-width: 600px;">
    
    <!-- Top Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold text-white mb-0">
                <i class="bi bi-geo-alt-fill text-info"></i> CivicAI Citizen Desk
            </h4>
            <span class="text-secondary small">Smart Geotagged Incident Reporter</span>
        </div>
        <a href="/login" class="btn btn-outline-light btn-sm rounded-pill px-3 shadow-sm">
            <i class="bi bi-shield-lock"></i> Officer Desk
        </a>
    </div>

    <!-- Quick Status Tracker -->
    <div class="portal-card p-3 mb-3 shadow">
        <div class="input-group">
            <input type="text" id="trackInput" class="form-control bg-dark text-white border-secondary" placeholder="Track ticket (e.g. GOV-CIVIC-12345)">
            <button class="btn btn-primary fw-bold" onclick="trackTicket()"><i class="bi bi-search"></i> Track</button>
        </div>
        <div id="trackResult" class="mt-3 d-none alert alert-dark border-secondary p-3 mb-0"></div>
    </div>

    <!-- Complaint Form -->
    <div class="portal-card p-4 shadow-lg">
        <form method="POST" action="/submit">
            
            <!-- Live Camera Section Only -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-secondary small fw-bold mb-0">LIVE CAMERA EVIDENCE</label>
                    <span class="badge bg-success bg-opacity-25 text-success small" id="gpsBadge">
                        <i class="bi bi-broadcast-pin"></i> GPS Synchronized
                    </span>
                </div>
                
                <div class="camera-box mb-2">
                    <span class="live-tag font-monospace" id="cameraGpsOverlay">
                        <i class="bi bi-geo-alt-fill text-danger"></i> Locking Satellite...
                    </span>
                    <video id="camera_feed" autoplay playsinline></video>
                    <img id="camera_preview" class="d-none" alt="Stamped Evidence Preview">
                </div>
                
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-info w-50 btn-sm" onclick="startCamera()">
                        <i class="bi bi-camera-video"></i> Retake / Start
                    </button>
                    <button type="button" class="btn btn-warning w-50 btn-sm fw-bold" id="snapBtn" onclick="captureSnapshotWithGPS()">
                        <i class="bi bi-camera-fill"></i> Snap Geotagged Evidence
                    </button>
                </div>

                <!-- Hidden inputs -->
                <input type="hidden" name="image_data" id="image_data">
                <input type="hidden" name="location" id="complaint_location">
                <canvas id="snap_canvas" class="d-none"></canvas>
            </div>

            <!-- Description with Voice Mic -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-secondary small fw-bold mb-0">INCIDENT DETAILS</label>
                    <button type="button" class="btn btn-outline-warning btn-sm py-0 px-2" onclick="startVoiceInput()" id="micBtn">
                        <i class="bi bi-mic-fill"></i> Speak (Voice Mic)
                    </button>
                </div>
                <textarea name="description" id="desc_input" rows="3" class="form-control bg-dark text-white border-secondary" placeholder="Describe the road crater, sewage overflow, broken streetlight..." required></textarea>
            </div>

            <!-- Department Selection -->
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">DEPARTMENT ROUTING</label>
                <select name="department" class="form-select bg-dark text-white border-secondary">
                    <option value="Auto-Detect via AI Engine" selected>Auto-Detect via AI Engine</option>
                    <option value="Roads & Transport">Roads & Transport</option>
                    <option value="Water Supply">Water Supply</option>
                    <option value="Sanitation & Waste">Sanitation & Waste</option>
                    <option value="Electricity & Power">Electricity & Power</option>
                    <option value="Town Planning">Town Planning</option>
                </select>
            </div>

            <button type="submit" class="btn btn-info w-100 py-2 fw-bold shadow">
                <i class="bi bi-send-fill me-1"></i> Dispatch Grievance to Municipal Authority
            </button>
        </form>
    </div>
</div>

<script>
let streamInstance = null;
let baseLat = 30.730376;
let baseLng = 76.168847;
let hasRealGPS = false;

// 1. Live Hardware GPS Watcher (High Accuracy enabled)
if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
        (pos) => {
            baseLat = pos.coords.latitude;
            baseLng = pos.coords.longitude;
            hasRealGPS = true;
            
            // Format to 6 decimal places (approx 11cm accuracy)
            const liveCoordStr = `${baseLat.toFixed(6)}, ${baseLng.toFixed(6)}`;
            document.getElementById('complaint_location').value = liveCoordStr;
            document.getElementById('cameraGpsOverlay').innerHTML = `<i class="bi bi-geo-alt-fill text-danger"></i> GPS: ${liveCoordStr}`;
            
            const badge = document.getElementById('gpsBadge');
            badge.className = "badge bg-success bg-opacity-25 text-success small";
            badge.innerHTML = `<i class="bi bi-check-circle-fill"></i> Satellite Locked`;
        },
        (err) => {
            console.warn("GPS Fallback active");
        },
        { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
    );
}

// 2. Dynamic Real-Distance Step Generator
// 0.0001 to 0.0002 deg offset = exactly 10 to 25 meters change (as if user walked a few paces)
function calculateStepCoordinates() {
    // 0.000100 to 0.000250 degree variance in 4th/5th decimal places
    const stepOffsetLat = (Math.random() - 0.5) * 0.000300;
    const stepOffsetLng = (Math.random() - 0.5) * 0.000300;
    
    const dynamicLat = (baseLat + stepOffsetLat).toFixed(6);
    const dynamicLng = (baseLng + stepOffsetLng).toFixed(6);
    return `${dynamicLat}, ${dynamicLng}`;
}

// Camera Starter
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" }, 
            audio: false 
        });
        const video = document.getElementById('camera_feed');
        const preview = document.getElementById('camera_preview');
        video.srcObject = stream;
        video.classList.remove('d-none');
        preview.classList.add('d-none');
        streamInstance = stream;
        
        const snapBtn = document.getElementById('snapBtn');
        if (snapBtn) {
            snapBtn.className = "btn btn-warning w-50 btn-sm fw-bold";
            snapBtn.innerHTML = '<i class="bi bi-camera-fill"></i> Snap Geotagged Evidence';
        }
    } catch (err) {
        alert("Camera access allow karein.");
    }
}

// Snapshot with Dynamic Distance-Based GPS Stamped
function captureSnapshotWithGPS() {
    const video = document.getElementById('camera_feed');
    const canvas = document.getElementById('snap_canvas');
    const preview = document.getElementById('camera_preview');
    const inputField = document.getElementById('image_data');
    const snapBtn = document.getElementById('snapBtn');

    if (!video || !video.srcObject) {
        alert("Pehle 'Retake / Start' dabakar camera chalayein!");
        return;
    }

    // Har snap par exact 15-20 meter ka real difference generate hoga
    const finalCoords = calculateStepCoordinates();
    document.getElementById('complaint_location').value = finalCoords;
    document.getElementById('cameraGpsOverlay').innerHTML = `<i class="bi bi-geo-alt-fill text-danger"></i> GPS: ${finalCoords}`;

    canvas.width = 640;
    canvas.height = 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, 640, 480);

    // WATERMARK OVERLAY
    ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
    ctx.fillRect(0, 405, 640, 75);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 15px monospace";
    ctx.fillText("CIVICAI LIVE EVIDENCE | " + new Date().toLocaleTimeString(), 15, 432);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px monospace";
    ctx.fillText("GEOTAG: " + finalCoords, 15, 458);

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(615, 442, 8, 0, 2 * Math.PI);
    ctx.fill();

    const base64Data = canvas.toDataURL('image/jpeg', 0.8);
    inputField.value = base64Data;

    preview.src = base64Data;
    preview.classList.remove('d-none');
    video.classList.add('d-none');

    if (snapBtn) {
        snapBtn.className = "btn btn-success w-50 btn-sm fw-bold";
        snapBtn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Geotag Stamped!';
    }
}

// Voice Input (Web Speech API)
function startVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Speech Recognition not supported on this browser.");
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';
    recognition.start();
    const btn = document.getElementById('micBtn');
    btn.innerHTML = '<i class="bi bi-record-circle text-danger"></i> Listening...';

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        const input = document.getElementById('desc_input');
        input.value = input.value ? input.value + " " + text : text;
        btn.innerHTML = '<i class="bi bi-mic-fill"></i> Speak';
    };
    recognition.onerror = () => {
        btn.innerHTML = '<i class="bi bi-mic-fill"></i> Speak';
    };
}

// Track Ticket API
async function trackTicket() {
    const tid = document.getElementById('trackInput').value.trim();
    const resBox = document.getElementById('trackResult');
    if (!tid) return;

    resBox.classList.remove('d-none');
    resBox.innerHTML = '<span class="text-secondary"><i class="bi bi-hourglass-split"></i> Checking ticket...</span>';

    try {
        const res = await fetch(`/api/track/${tid}`);
        const data = await res.json();
        if (data.found) {
            let statusColor = data.status === 'Resolved' ? 'success' : (data.status === 'Denied' ? 'danger' : 'warning text-dark');
            let html = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold text-info font-monospace">${data.ticket_id}</span>
                    <span class="badge bg-${statusColor}">${data.status}</span>
                </div>
                <div class="small text-secondary mb-1">Department: <strong class="text-light">${data.department}</strong> | Priority: <strong class="text-light">${data.priority}</strong></div>
                <div class="small text-secondary mb-2">SLA Deadline: <strong class="text-light">${data.deadline}</strong></div>
            `;
            if (data.resolution_media) {
                html += `<div class="mt-2 text-success small fw-bold"><i class="bi bi-check2-circle"></i> Resolution proof attached.</div>`;
            }
            resBox.innerHTML = html;
        } else {
            resBox.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle"></i> ${data.msg}</span>`;
        }
    } catch (e) {
        resBox.innerHTML = `<span class="text-danger">Failed to fetch ticket.</span>`;
    }
}

window.addEventListener('load', () => { 
    startCamera(); 
    document.getElementById('complaint_location').value = calculateStepCoordinates();
});
</script>
</body>
</html>
