<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAI - AI Powered Citizen Grievance Portal</title>
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS for Spot Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            color: #f8fafc;
            padding: 30px 12px;
        }
        .portal-card {
            background: #161f30;
            border-radius: 24px;
            border: 1px solid #232f48;
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 1px solid #232f48;
            padding: 24px 20px;
            text-align: center;
        }
        .card-body-custom {
            padding: 26px 22px;
        }
        .form-control, .form-select {
            background: #0d1525;
            border: 1px solid #283756;
            color: #f8fafc;
            border-radius: 10px;
        }
        .form-control:focus, .form-select:focus {
            background: #0d1525;
            border-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .upload-box {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .upload-box:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }
        #map {
            height: 180px;
            width: 100%;
            border-radius: 12px;
            border: 1px solid #232f48;
        }
        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            z-index: 1050;
            max-height: 180px;
            overflow-y: auto;
            display: none;
        }
        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            color: #cbd5e1;
            border-bottom: 1px solid #1f2937;
        }
        .suggestion-item:hover {
            background: #1f2937;
            color: #ffffff;
        }
        .btn-submit {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
        }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="card-header-custom">
        <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
            <i class="fa-solid fa-city text-primary fa-2x"></i>
            <h3 class="fw-bold m-0 text-white">CivicAI Citizen Portal</h3>
        </div>
        <p class="text-secondary small m-0">Report Grievances with AI Triage & Direct Official Email Dispatch</p>
    </div>

    <div class="card-body-custom">
        <form action="/analyze" method="POST" enctype="multipart/form-data">
            
            <!-- Hidden Inputs for Coordinates -->
            <input type="hidden" id="latitudeInput" name="latitude">
            <input type="hidden" id="longitudeInput" name="longitude">

            <!-- 1. Complaint Description -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-white">
                    <i class="fa-solid fa-pen-to-square text-info me-1"></i> Grievance Details
                </label>
                <textarea class="form-control" name="complaint" rows="3" placeholder="Describe the issue (e.g., Pothole on main road, broken street light, overflowing garbage)..." required></textarea>
            </div>

            <!-- 2. Target Department -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-white">
                    <i class="fa-solid fa-building-flag text-warning me-1"></i> Relevant Department
                </label>
                <select class="form-select" name="department">
                    <option value="auto" selected>Auto-Detect via AI Engine</option>
                    <option value="Roads & Transport">Roads & Transport Department</option>
                    <option value="Sanitation & Waste">Sanitation & Municipal Waste</option>
                    <option value="Water Supply">Water Supply & Drainage</option>
                    <option value="Electricity Board">Electricity & Street Lighting</option>
                    <option value="Public Safety">Public Safety & Municipal Authority</option>
                </select>
            </div>

            <!-- 3. Spot Location & Auto GPS -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-white d-flex justify-content-between">
                    <span><i class="fa-solid fa-location-dot text-danger me-1"></i> Incident Location Spot</span>
                    <span class="text-info small" style="cursor:pointer;" onclick="triggerLiveGPS()">
                        <i class="fa-solid fa-crosshairs me-1"></i> Tag Current GPS
                    </span>
                </label>
                <div class="position-relative">
                    <div class="input-group">
                        <input type="text" class="form-control" id="locationInput" name="location" placeholder="Detecting live GPS or search area..." autocomplete="off" required>
                        <button class="btn btn-outline-info" type="button" onclick="triggerLiveGPS()" title="Tag Live GPS">
                            <i class="fa-solid fa-location-crosshairs"></i>
                        </button>
                    </div>
                    <div id="suggestionsBox" class="suggestions-dropdown"></div>
                </div>
                
                <!-- Live Interactive Map View -->
                <div id="map" class="mt-2"></div>
                <div class="d-flex justify-content-between align-items-center mt-1">
                    <small class="text-secondary" style="font-size: 11px;">
                        <i class="fa-solid fa-circle-info me-1"></i> Drag pin or click map to adjust location
                    </small>
                    <span id="coordBadge" class="badge bg-dark border border-secondary text-info" style="font-size: 10px;">GPS: Waiting</span>
                </div>
            </div>

            <!-- 4. Evidence Media Upload (Photo/Video with Live GPS Tagging) -->
            <div class="mb-4">
                <label class="form-label small fw-bold text-white">
                    <i class="fa-solid fa-camera-retro text-success me-1"></i> Evidence Photo / Video
                </label>
                <div class="upload-box" onclick="document.getElementById('mediaFileInput').click();">
                    <i class="fa-solid fa-cloud-arrow-up fa-2x text-secondary mb-1"></i>
                    <div id="uploadText" class="text-white small fw-semibold">Click to capture / upload damage evidence</div>
                    <small class="text-secondary" style="font-size: 11px;">Supports JPG, PNG, MP4, MOV (GPS automatically tags to media)</small>
                </div>
                <input type="file" id="mediaFileInput" name="damage_media" accept="image/*,video/*" style="display:none;" onchange="handleMediaSelected(this)">
                
                <!-- GPS Tagging Notification for Media -->
                <div id="mediaGpsStatus" class="mt-2 text-secondary small" style="display: none;"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-submit w-100 text-white shadow-lg">
                <i class="fa-solid fa-bolt me-1"></i> Process Grievance & Dispatch
            </button>
        </form>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Initialize Map
    let defaultLat = 28.6139, defaultLng = 77.2090; // Default Delhi/India
    const map = L.map('map').setView([defaultLat, defaultLng], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

    function updateLocation(lat, lng, labelText = null) {
        lat = parseFloat(lat).toFixed(6);
        lng = parseFloat(lng).toFixed(6);

        document.getElementById('latitudeInput').value = lat;
        document.getElementById('longitudeInput').value = lng;
        document.getElementById('coordBadge').innerText = `${lat}, ${lng}`;

        if (labelText) {
            document.getElementById('locationInput').value = labelText;
        } else {
            // Reverse Geocode
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.display_name) {
                        document.getElementById('locationInput').value = data.display_name;
                    } else {
                        document.getElementById('locationInput').value = `Incident Spot [${lat}, ${lng}]`;
                    }
                })
                .catch(() => {
                    document.getElementById('locationInput').value = `Incident Spot [${lat}, ${lng}]`;
                });
        }
    }

    marker.on('dragend', function (e) {
        const coord = e.target.getLatLng();
        map.setView(coord);
        updateLocation(coord.lat, coord.lng);
    });

    map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        map.setView(e.latlng);
        updateLocation(e.latlng.lat, e.latlng.lng);
    });

    // 2. Fetch Live GPS
    function triggerLiveGPS(callback) {
        if (navigator.geolocation) {
            document.getElementById('coordBadge').innerText = "Locating...";
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]);
                    updateLocation(lat, lng);
                    if (callback) callback(lat, lng);
                },
                function (err) {
                    document.getElementById('coordBadge').innerText = "GPS Blocked";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }

    // 3. Auto Tag Media with GPS on file selection
    function handleMediaSelected(fileInput) {
        if (fileInput.files && fileInput.files.length > 0) {
            const fileName = fileInput.files[0].name;
            document.getElementById('uploadText').innerText = `Selected: ${fileName}`;

            const gpsDiv = document.getElementById('mediaGpsStatus');
            gpsDiv.style.display = 'block';
            gpsDiv.className = 'mt-2 text-info small';
            gpsDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> File chosen. Stamping live GPS coordinates on media...';

            triggerLiveGPS(function (lat, lng) {
                gpsDiv.className = 'mt-2 text-success small fw-semibold';
                gpsDiv.innerHTML = `<i class="fa-solid fa-circle-check text-success me-1"></i> Live GPS Tagged to Media: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            });
        }
    }

    // 4. Autocomplete Location Search
    let searchTimer;
    document.getElementById('locationInput').addEventListener('input', function () {
        clearTimeout(searchTimer);
        const query = this.value.trim();
        const box = document.getElementById('suggestionsBox');

        if (query.length < 3) {
            box.style.display = 'none';
            return;
        }

        searchTimer = setTimeout(() => {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(items => {
                    box.innerHTML = '';
                    if (items && items.length > 0) {
                        items.slice(0, 5).forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = item.display_name;
                            div.onclick = function () {
                                const lat = parseFloat(item.lat);
                                const lon = parseFloat(item.lon);
                                map.setView([lat, lon], 16);
                                marker.setLatLng([lat, lon]);
                                updateLocation(lat, lon, item.display_name);
                                box.style.display = 'none';
                            };
                            box.appendChild(div);
                        });
                        box.style.display = 'block';
                    } else {
                        box.style.display = 'none';
                    }
                });
        }, 300);
    });

    // Auto-detect GPS on initial page load
    window.addEventListener('DOMContentLoaded', () => {
        triggerLiveGPS();
    });
</script>

</body>
</html>
