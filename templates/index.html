<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAI - AI Powered Citizen Grievance Portal</title>
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS for Spot Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
   <style>
        body {
            background: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 12px;
            color: #0f172a;
        }
        .portal-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            max-width: 520px;
            width: 100%;
            padding: 28px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }
        .card-header-custom h3 {
            color: #0f172a !important;
            font-weight: 700;
        }
        .card-header-custom p,
        .text-secondary {
            color: #475569 !important;
            font-size: 13px;
        }
        label, .form-label {
            color: #1e293b !important;
            font-weight: 600;
            font-size: 13.5px;
        }
        .form-control {
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
        }
        .form-control::placeholder {
            color: #94a3b8 !important;
        }
        .form-control:focus {
            background: #ffffff !important;
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
        }
        .upload-box {
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upload-box:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .upload-box i {
            color: #2563eb;
        }
        .upload-box span, .upload-box p {
            color: #0f172a !important;
            font-weight: 600;
        }
        .upload-box small {
            color: #64748b !important;
        }
        .btn-submit {
            background: #2563eb;
            color: #ffffff !important;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 600;
            font-size: 15px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.25);
            transition: background 0.2s ease;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        #map {
            width: 100%;
            height: 220px !important;
            min-height: 220px !important;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            margin-top: 8px;
            z-index: 1;
        
        }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="card-header-custom">
        <!-- Header with Officer Login Button -->
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <div>
                <h4 class="fw-bold m-0 text-dark">
                    <i class="fa-solid fa-city text-primary me-2"></i>CivicAI Citizen Portal
                </h4>
                <p class="text-secondary small m-0 mt-1">Smart Grievance Redressal & Triage</p>
            </div>
            <a href="/login" class="btn btn-outline-dark btn-sm fw-semibold shadow-sm" style="border-radius: 8px; font-size: 12px; padding: 6px 12px;">
                <i class="fa-solid fa-user-shield text-primary me-1"></i> Officer Login
            </a>
        </div>
        <p class="text-secondary small m-0">Report Grievances with AI Triage & Direct Official Email Dispatch</p>
    </div>

    <div class="card-body-custom">
        <form action="/analyze" method="POST" enctype="multipart/form-data">
            
            <!-- Hidden Inputs for Coordinates -->
            <input type="hidden" id="latitudeInput" name="latitude">
            <input type="hidden" id="longitudeInput" name="longitude">

            <!-- 1. Complaint Description -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-white">
                    <i class="fa-solid fa-pen-to-square text-info me-1"></i> Grievance Details
                </label>
                <textarea class="form-control" name="complaint" rows="3" placeholder="Describe the issue (e.g., Pothole on main road, broken street light, overflowing garbage)..." required></textarea>
            </div>

            <!-- 2. Target Department -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-white">
                    <i class="fa-solid fa-building-flag text-warning me-1"></i> Relevant Department
                </label>
                <select class="form-select" name="department">
                    <option value="auto" selected>Auto-Detect via AI Engine</option>
                    <option value="Roads & Transport">Roads & Transport Department</option>
                    <option value="Sanitation & Waste">Sanitation & Municipal Waste</option>
                    <option value="Water Supply">Water Supply & Drainage</option>
                    <option value="Electricity Board">Electricity & Street Lighting</option>
                    <option value="Public Safety">Public Safety & Municipal Authority</option>
                </select>
            </div>

            <!-- Live Evidence Camera with Satellite GPS -->
<div class="mb-3">
    <label class="form-label small fw-bold text-white">
        <i class="fa-solid fa-camera text-primary me-1"></i> Live Evidence (Photo / Video)
    </label>
    <input type="file" 
           name="damage_media" 
           id="liveCameraInput" 
           class="form-control" 
           accept="image/*,video/*" 
           capture="environment" 
           required 
           onchange="fetchSatelliteLock(this)">
    <div class="mt-2" id="gpsSatelliteStatus" style="font-size: 12px; color: #94a3b8;">
        <i class="fa-solid fa-satellite text-info me-1"></i> Satellite GPS: Click photo/video to lock coordinates automatically
    </div>
</div>

<!-- Hidden coordinates for backend -->
<input type="hidden" name="location" id="locationInput">
<input type="hidden" name="latitude" id="latitudeInput">
<input type="hidden" name="longitude" id="longitudeInput">

            <!-- Submit Button -->
            <button type="submit" class="btn btn-submit w-100 text-white shadow-lg">
                <i class="fa-solid fa-bolt me-1"></i> Process Grievance & Dispatch
            </button>
        </form>
    </div>
</div>

<script>
// Live Media Upload & Satellite GPS Sync
function handleLiveMediaUpload(input) {
    const statusDiv = document.getElementById('mediaGpsStatus');
    const uploadText = document.getElementById('uploadText');
    
    if (input.files && input.files[0]) {
        const file = input.files[0];
        if (uploadText) {
            uploadText.innerText = "Selected: " + file.name;
        }
        
        if (statusDiv) {
            statusDiv.style.display = "block";
            statusDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-warning me-1"></i> Fetching satellite GPS coordinates...';
        }
        
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    const acc = Math.round(position.coords.accuracy);

                    const latInput = document.getElementById('latitudeInput');
                    const lngInput = document.getElementById('longitudeInput');
                    const locInput = document.getElementById('locationInput');

                    if (latInput) latInput.value = lat;
                    if (lngInput) lngInput.value = lng;
                    if (locInput) locInput.value = `${lat}, ${lng}`;

                    if (statusDiv) {
                        statusDiv.innerHTML = `<span class="text-success fw-bold"><i class="fa-solid fa-satellite-dish me-1"></i> GPS Locked: ${lat}, ${lng} (±${acc}m accuracy)</span>`;
                    }
                },
                function(error) {
                    if (statusDiv) {
                        statusDiv.innerHTML = '<span class="text-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i> Location permission denied. Please enable GPS.</span>';
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            if (statusDiv) {
                statusDiv.innerHTML = '<span class="text-danger">Geolocation not supported on this device.</span>';
            }
        }
    }
}
<script>
function fetchSatelliteLock(inputElement) {
    const statusBox = document.getElementById('gpsSatelliteStatus');
    if (inputElement.files && inputElement.files.length > 0) {
        if (statusBox) {
            statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> Connecting to GPS Satellites... Locking live position...';
        }
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    const accuracy = Math.round(position.coords.accuracy);

                    const latEl = document.getElementById('latitudeInput');
                    const lngEl = document.getElementById('longitudeInput');
                    const locEl = document.getElementById('locationInput');
                    if (latEl) latEl.value = lat;
                    if (lngEl) lngEl.value = lng;
                    if (locEl) locEl.value = `${lat}, ${lng}`;

                    if (statusBox) {
                        statusBox.innerHTML = `<span class="text-success fw-bold"><i class="fa-solid fa-circle-check me-1"></i> Satellite Locked: Lat ${lat}, Lng ${lng} (±${accuracy}m accuracy)</span>`;
                    }
                },
                function(error) {
                    if (statusBox) {
                        statusBox.innerHTML = '<span class="text-danger fw-bold"><i class="fa-solid fa-triangle-exclamation me-1"></i> GPS permission blocked. Please allow browser location access.</span>';
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }
    }
}
</script>
</body>
</html>
