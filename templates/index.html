<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAI - Citizen Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-custom { max-width: 620px; margin: 40px auto; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        #camera-feed { width: 100%; height: 260px; object-fit: cover; border-radius: 10px; background: #000; display: block; }
        #captured-preview { width: 100%; height: 260px; object-fit: cover; border-radius: 10px; display: none; }
    </style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container py-4">

        <!-- PUBLIC TICKET TRACKING SECTION -->
        <div class="card bg-dark border-secondary text-white my-4 p-3 rounded-4 shadow-sm" id="civic-track-box">
            <h5 class="fw-bold text-info mb-2"><i class="bi bi-search"></i> Track Your Grievance Status</h5>
            <p class="text-secondary small mb-3">Enter your Ticket ID (e.g., GOV-CIVIC-XXXXX) to check real-time progress.</p>
            <div class="input-group">
                <input type="text" id="track_ticket_input" class="form-control bg-black text-white border-secondary" placeholder="Enter Ticket ID...">
                <button class="btn btn-info px-4 fw-bold" type="button" onclick="checkGrievanceStatus()">Track Status</button>
            </div>
            <div id="track_result" class="mt-3 d-none"></div>
        </div>
        <hr class="border-secondary my-4">
    
    <div class="card card-custom p-4">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold text-dark m-0"><i class="fa-solid fa-city text-primary me-2"></i>CivicAI Citizen Portal</h4>
                <p class="text-muted small m-0">Smart Grievance Redressal &amp; Triage</p>
            </div>
            <a href="/login" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-user-shield me-1"></i> Officer Login</a>
        </div>

        <p class="text-secondary small mb-3">Report Grievances with AI Triage &amp; Direct Official Email Dispatch</p>

        <form id="grievanceForm" action="/analyze" method="POST" enctype="multipart/form-data">
            
            <!-- Citizen Problem Description -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark mb-1">
                    <i class="fa-solid fa-align-left text-primary me-1"></i> Grievance Description / Citizen Notes
                </label>
                <textarea name="description" id="description" class="form-control" rows="3" placeholder="Describe the issue in detail (e.g. broken water pipeline, pothole on road, garbage overflow)..." required></textarea>
            </div>

            <!-- Single Relevant Department Dropdown -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark mb-1">
                    <i class="fa-solid fa-building text-primary me-1"></i> Relevant Department
                </label>
                <select name="department" id="department" class="form-select form-select-sm">
                    <option value="Auto-Detect via AI Engine" selected>Auto-Detect via AI Engine</option>
                    <option value="Roads &amp; Public Works">Roads &amp; Public Works</option>
                    <option value="Water &amp; Sanitation">Water &amp; Sanitation</option>
                    <option value="Sanitation &amp; Waste Management">Sanitation &amp; Waste Management</option>
                    <option value="Electricity &amp; Street Lighting">Electricity &amp; Street Lighting</option>
                    <option value="Town Planning &amp; Enforcement">Town Planning &amp; Enforcement</option>
                </select>
            </div>

            <!-- Live Evidence Capture -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark mb-1">
                    <i class="fa-solid fa-camera text-primary me-1"></i> Live Evidence Capture (Real-time AI Scan + Satellite GPS)
                </label>
                
                <div class="position-relative bg-dark rounded p-2 text-center mb-2">
                    <video id="camera-feed" autoplay playsinline></video>
                    <img id="captured-preview" alt="Evidence Preview">
                    <div id="gps-badge" class="position-absolute bottom-0 start-0 m-3 px-2 py-1 rounded small font-monospace text-warning bg-dark bg-opacity-75 border border-secondary" style="font-size: 11px;">
                        LAT: 30.730376 | LNG: 76.168847 (±10m)
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" id="startCamBtn" class="btn btn-outline-secondary btn-sm flex-fill" onclick="initCamera()">
                        <i class="fa-solid fa-camera-rotate me-1"></i> Open / Switch Camera
                    </button>
                    <button type="button" id="snapBtn" class="btn btn-success btn-sm flex-fill" onclick="snapPhoto()">
                        <i class="fa-solid fa-crosshairs me-1"></i> Snap &amp; Scan with GPS
                    </button>
                </div>
            </div>

            <input type="hidden" name="location" id="location" value="30.730376, 76.168847">
            <input type="hidden" name="image_base64" id="image_base64">

            <!-- Process & Dispatch Submit Button -->
            <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-bold py-2 mt-2 shadow-sm">
                <i class="fa-solid fa-bolt me-2"></i> Process Grievance &amp; Dispatch via AI
            </button>

        </form>

    </div>
</div>

<script>
    const video = document.getElementById('camera-feed');
    const preview = document.getElementById('captured-preview');
    const b64Input = document.getElementById('image_base64');
    let stream = null;

    async function initCamera() {
        try {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            video.style.display = 'block';
            preview.style.display = 'none';
        } catch (err) {
            console.log("Camera access:", err);
        }
    }
    window.addEventListener('DOMContentLoaded', initCamera);

    function snapPhoto() {
        if (!video.videoWidth) return;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        // Auto-Compress Snap
        const maxW = 1080;
        let scale = Math.min(1, maxW / (video.videoWidth || 1080));
        canvas.width = (video.videoWidth || 1080) * scale;
        canvas.height = (video.videoHeight || 720) * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        const b64 = document.getElementById('image_base64');
        if (b64) b64.value = dataUrl;
        if (preview) {
            preview.src = dataUrl;
            video.style.display = 'none';
            preview.style.display = 'block';
        }
    }

    document.getElementById('grievanceForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Analyzing &amp; Dispatching...';
        
        if (!b64Input.value && video && video.videoWidth) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            b64Input.value = canvas.toDataURL('image/jpeg', 0.85);
        }
    });

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            const loc = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6);
            document.getElementById('location').value = loc;
            document.getElementById('gps-badge').textContent = "LAT: " + pos.coords.latitude.toFixed(6) + " | LNG: " + pos.coords.longitude.toFixed(6) + " (±" + Math.round(pos.coords.accuracy) + "m)";
        }, err => console.log(err), { enableHighAccuracy: true });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
</body>
</html>
